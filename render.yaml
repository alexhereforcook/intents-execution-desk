# Render blueprint: one free web service running the worker and the dashboard.
services:
  - type: web
    name: intents-execution-desk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /_stcore/health
    envVars:
      - key: ONECLICK_API_KEY
        sync: false          # set in the Render dashboard, never in git
      - key: DATABASE_URL
        sync: false          # Postgres URL (Neon / Supabase); SQLite on Render is wiped on restart
      - key: DESK_MODE
        value: shadow
      - key: PYTHON_VERSION
        value: 3.12.7
